
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      background: #0051ff;
      filter: blur(150px);
      opacity: 0.7;
      top: -100px;
      right: -80px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 350px;
      height: 350px;
      background: #c310fa;
      filter: blur(150px);
      opacity: 0.4;
      bottom: -100px;
      left: -80px;
    }

    .clock-card {
      position: relative;
      z-index: 1;
      width: min(90%, 550px);
      padding: 45px 25px;
      text-align: center;
      border: 1px solid #ffffff20;
      border-radius: 28px;
      background: #ffffff0a;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 50px #254aff15;
    }

    .title {
      font-size: 16px;
      color: #b9b9c9;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    #clock {
      font-size: clamp(42px, 10vw, 76px);
      font-weight: bold;
      direction: ltr;
      background: linear-gradient(90deg, #448aff, #bd67ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    #date {
      margin-top: 20px;
      font-size: 17px;
      color: #d0d0df;
    }

    .status {
      margin-top: 30px;
      color: #8f91a5;
      font-size: 13px;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #42ff9e;
      margin-left: 7px;
      box-shadow: 0 0 10px #42ff9e;
    }
  </style>
</head>

<body>
  <div class="clock-card">
    <div class="title">DIGITAL CLOCK</div>

    <div id="clock">00:00:00</div>

    <div id="date">جاري تحميل التاريخ...</div>

    <div class="status">
      <span class="dot"></span>
      الساعة تعمل مباشرة
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      const time = now.toLocaleTimeString("en-GB", {
        timeZone: "Africa/Algiers",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      const date = now.toLocaleDateString("ar-DZ", {
        timeZone: "Africa/Algiers",
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      document.getElementById("clock").textContent = time;
      document.getElementById("date").textContent = date;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
